<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>NMD FloodWatch - ระบบเฝ้าระวังน้ำท่วม เทศบาลตำบลหนองไม้แดง</title>
    
    <!-- Fonts & Frameworks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; color: #334155; }
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .badge-live-info { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 6px 14px; }
        
        .nav-pills .nav-link { font-weight: 500; color: #64748b; border-radius: 12px; padding: 12px 18px; margin-bottom: 8px; text-align: left; }
        .nav-pills .nav-link.active { background-color: #0284c7; color: white; }
        
        .custom-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08); padding: 20px; margin-bottom: 20px; }
        .map-frame { height: 550px; width: 100%; border-radius: 12px; background-color: #e2e8f0; overflow: hidden; position: relative; }
        .picker-map-frame { height: 260px; width: 100%; border-radius: 8px; border: 1px solid #cbd5e1; margin-top: 8px; }

        .filter-box { background: #f1f5f9; border-radius: 10px; padding: 8px 14px; cursor: pointer; border: 1px solid #cbd5e1; font-weight: 500; }
        .footer-sticky { position: sticky; bottom: 0; z-index: 1000; background: #ffffff; border-top: 2px solid #e2e8f0; padding: 10px 0; }
        
        .cctv-video-container { position: relative; width: 100%; height: 550px; border-radius: 12px; overflow: hidden; border: 1px solid #cbd5e1; background: #000; }
        .cctv-iframe { width: 100%; height: 100%; border: 0; }

        .cam-btn { border-radius: 8px; font-weight: 500; font-size: 0.88rem; padding: 8px 14px; transition: all 0.2s; }
        .cam-btn.active { background-color: #0284c7 !important; color: white !important; border-color: #0284c7 !important; }

        .need-tag { display: inline-block; background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; font-size: 0.78rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-right: 4px; margin-top: 4px; }
        .chk-box-card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 12px; background: #f8fafc; transition: all 0.2s; cursor: pointer; }
        .chk-box-card:hover { background: #f1f5f9; }

        .img-preview-box { max-height: 180px; border-radius: 8px; border: 1px solid #cbd5e1; object-fit: cover; display: none; }
        .report-img-thumb { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
        .report-img-thumb:hover { transform: scale(1.02); }

        .radar-switch-btn { font-size: 0.85rem; font-weight: 600; padding: 6px 14px; border-radius: 8px; }

        .official-radar-box {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .official-radar-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .radar-status-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
        }

        .touch-enabled-iframe {
            width: 100%;
            height: 100%;
            border: 0;
            pointer-events: auto !important;
        }
    </style>
</head>
